<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanchit Flappy Bird</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
overflow:hidden;

background:linear-gradient(270deg,#00c6ff,#0072ff,#6dd5fa,#2980b9);
background-size:800% 800%;
animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

canvas{
background:#87CEEB;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* PANEL */

.panel{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:45px;
border-radius:25px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
box-shadow:0 10px 40px rgba(0,0,0,0.3);
text-align:center;
color:white;
}

/* TITLE */

.title{
font-size:48px;
letter-spacing:3px;
margin:15px 0;
animation:titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

/* BUTTON */

button{
margin-top:20px;
padding:16px 40px;
font-size:20px;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#00ff9d,#00c853);
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

#gameOver{
display:none;
}

</style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="startScreen" class="panel">

<img src="face.png" width="70">

<h3>Sanchit Chalakh</h3>

<h1 class="title">FLAPPY BIRD</h1>

<p>Best Score: <span id="bestScore">0</span></p>

<button onclick="startGame()">▶ PLAY</button>

</div>

<div id="gameOver" class="panel">

<h2>Game Over</h2>

<p id="finalScore"></p>

<p>Best Score: <span id="bestScore2">0</span></p>

<button onclick="restartGame()">Restart</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let gameRunning = false;

/* BEST SCORE */

let bestScore = localStorage.getItem("bestScore") || 0;

document.getElementById("bestScore").innerText = bestScore;
document.getElementById("bestScore2").innerText = bestScore;

/* BIRD */

let birdImg = new Image();
birdImg.src = "face.png";

let bird = {
x:80,
y:200,
width:50,
height:50,
gravity:0.5,
lift:-8,
velocity:0
};

let pipes = [];

let pipeInterval;

function startPipeInterval(){
pipeInterval = setInterval(createPipe,2000);
}

function stopPipeInterval(){
clearInterval(pipeInterval);
}

function createPipe(){

let gap = 200;
let topHeight = Math.random()*300 + 50;

pipes.push({
x:canvas.width,
top:topHeight,
bottom:topHeight+gap,
width:40,
passed:false
});

}

function drawBird(){

ctx.drawImage(
birdImg,
bird.x,
bird.y,
bird.width,
bird.height
);

}

function updateBird(deltaTime){

bird.velocity += bird.gravity*(deltaTime/16);
bird.y += bird.velocity*(deltaTime/16);

if(bird.y + bird.height >= canvas.height){

bird.y = canvas.height - bird.height;
gameOver();

}

if(bird.y <=0){

bird.y = 0;
bird.velocity = 0;

}

}

function drawPipes(deltaTime){

pipes.forEach(pipe=>{

pipe.x -= 2*(deltaTime/16);

/* 3D PIPE */

let gradient = ctx.createLinearGradient(pipe.x,0,pipe.x+pipe.width,0);

gradient.addColorStop(0,"#145A32");
gradient.addColorStop(0.3,"#27ae60");
gradient.addColorStop(0.6,"#2ecc71");
gradient.addColorStop(1,"#145A32");

ctx.fillStyle = gradient;

ctx.fillRect(pipe.x,0,pipe.width,pipe.top);
ctx.fillRect(pipe.x,pipe.bottom,pipe.width,canvas.height);

/* MARIO CAP */

ctx.fillStyle="#2ecc71";
ctx.fillRect(pipe.x-10,pipe.top-20,pipe.width+20,20);
ctx.fillRect(pipe.x-10,pipe.bottom,pipe.width+20,20);

/* SCORE */

if(pipe.x + pipe.width < bird.x && !pipe.passed){

score++;
pipe.passed=true;

}

if(
bird.x < pipe.x + pipe.width &&
bird.x + bird.width > pipe.x &&
(bird.y < pipe.top || bird.y + bird.height > pipe.bottom)
){

gameOver();

}

});

pipes = pipes.filter(pipe=>pipe.x + pipe.width >0);

}

function drawScore(){

if(score > bestScore){

bestScore = score;
localStorage.setItem("bestScore", bestScore);

}

ctx.fillStyle="black";
ctx.font="30px Arial";

ctx.fillText("Score: "+score,10,40);
ctx.fillText("Best: "+bestScore,10,80);

}

function gameOver(){

gameRunning=false;

stopPipeInterval();

bird.velocity=0;

document.getElementById("bestScore").innerText = bestScore;
document.getElementById("bestScore2").innerText = bestScore;

document.getElementById("gameOver").style.display="block";

document.getElementById("finalScore").innerText="Score: "+score;

}

function restartGame(){

score=0;
bird.y=200;
bird.velocity=0;
pipes=[];

gameRunning=true;

document.getElementById("gameOver").style.display="none";

lastTime=null;

startPipeInterval();

requestAnimationFrame(gameLoop);

}

function startGame(){

document.getElementById("startScreen").style.display="none";

gameRunning=true;

startPipeInterval();

requestAnimationFrame(gameLoop);

}

let jumpSound = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

canvas.addEventListener("touchstart",function(){

if(!gameRunning) return;

bird.velocity = bird.lift;

jumpSound.play();

});

let lastTime=null;

function gameLoop(timestamp){

if(!lastTime) lastTime = timestamp;

const deltaTime = timestamp-lastTime;

lastTime = timestamp;

ctx.clearRect(0,0,canvas.width,canvas.height);

if(gameRunning){

updateBird(deltaTime);
drawBird();
drawPipes(deltaTime);
drawScore();

}

requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
